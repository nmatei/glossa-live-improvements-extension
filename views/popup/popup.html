<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Glossa.live Controls</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup">
      <div id="section-links" class="popup-links">
        <div class="popup-links-row">
          <button id="btn-website" class="popup-link" title="Open Glossa.live website">
            <span class="dot" id="dot-website"></span>
            <span class="btn-icon" id="icon-website"></span>
            <span class="btn-label">Glossa.live</span>
          </button>
          <button id="btn-open-live" class="popup-link" title="Open your live page">
            <span class="dot" id="dot-open-live"></span>
            <span class="btn-icon" id="icon-open-live"></span>
            <span class="btn-label">Open Live</span>
          </button>
        </div>
        <hr class="links-separator" />
      </div>

      <div class="popup-grid">
        <button id="btn-play-pause" class="popup-btn" title="Play / Pause">
          <span class="btn-icon" id="icon-play-pause"></span>
          <span class="btn-label" id="label-play-pause">Play</span>
        </button>

        <button id="btn-mute" class="popup-btn" title="Mute / Unmute">
          <span class="btn-icon" id="icon-mute"></span>
          <span class="btn-label" id="label-mute">Mute</span>
        </button>

        <button id="btn-refresh" class="popup-btn" title="Refresh page (restores play state)">
          <span class="btn-icon" id="icon-refresh"></span>
          <span class="btn-label">Refresh</span>
        </button>

        <button id="btn-fullscreen" class="popup-btn" title="Fullscreen / Restore">
          <span class="btn-icon" id="icon-fullscreen"></span>
          <span class="btn-label" id="label-fullscreen">Fullscreen</span>
        </button>
      </div>

      <details id="section-settings" class="popup-settings">
        <summary>
          <span class="settings-summary-label">
            <span class="btn-icon" id="icon-settings"></span>
            <span>Settings</span>
          </span>
          <span class="chevron" id="icon-chevron"></span>
        </summary>
        <div class="settings-body">
          <label for="input-live-url" class="settings-label">Live URL</label>
          <input
            id="input-live-url"
            type="url"
            class="settings-input"
            placeholder="https://glossa.live/..."
          />

          <label for="input-bg-color-text" class="settings-label">Background color</label>
          <div class="color-field">
            <input id="input-bg-color" type="color" class="color-swatch" />
            <input
              id="input-bg-color-text"
              type="text"
              class="settings-input"
              spellcheck="false"
              placeholder="#82663a"
            />
          </div>
        </div>
      </details>

      <div id="popup-footer" class="popup-footer">
        <span class="status-dot" id="status-dot"></span>
        <span id="status" class="status"></span>
      </div>
    </div>

    <script src="../icons/icons.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
